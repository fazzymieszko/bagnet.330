<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BagNet - Czat i Społeczność</title>
    <link href="https://fonts.cdnfonts.com/css/black-family" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/final-front" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
        }

        header {
            background-color: rgb(79, 0, 29);
            color: white;
            font-size: 80px;
            font-family: 'Final Front', sans-serif;
            margin: 20px;
            border: 5px solid rgb(56, 0, 26);
            padding: 10px;
        }

        .skibidi {
            font-family: 'Times New Roman', Times, serif;
            font-size: 25px;
        }

        .bt-align {
            margin: 0 20px 20px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .button {
            background-color: #ad0137;
            color: rgb(18, 0, 25);
            border: 5px solid #ad012c;
            border-radius: 5px;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .button:hover, .button.active {
            transform: scale(1.08);
            background-color: #e6004c;
            color: #ffffff;
        }

        /* MODAL LOGOWANIA / REJESTRACJI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-box {
            background: #140007;
            border: 3px solid #ad0137;
            border-radius: 12px;
            padding: 30px;
            width: 350px;
            text-align: center;
            box-shadow: 0 0 25px rgba(173, 1, 55, 0.6);
        }

        .auth-box h2 {
            font-family: 'Final Front', sans-serif;
            font-size: 30px;
            margin-bottom: 20px;
            color: #fff;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #1f000c;
            border: 1px solid #56001a;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            background: #ad0137;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-box button:hover {
            background: #e6004c;
        }

        .auth-switch {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
        }

        .auth-switch span {
            color: #ff3366;
            text-decoration: underline;
        }

        /* OKNO CZATU */
        .chat-wrapper {
            margin: 0 20px 40px 20px;
            background: rgba(10, 0, 5, 0.95);
            border: 2px solid #ad0137;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(173, 1, 55, 0.4);
            overflow: hidden;
            display: none; /* Ukryte dopóki użytkownik się nie zaloguje */
        }

        .chat-navbar {
            background-color: #1a0008;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #38001a;
        }

        .chat-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Final Front', sans-serif;
            font-size: 22px;
        }

        .chat-brand img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        .chat-nav-tabs {
            display: flex;
            gap: 10px;
        }

        .nav-tab {
            background: #2b000d;
            color: #ccc;
            border: 1px solid #56001a;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .nav-tab.active, .nav-tab:hover {
            background: #ad0137;
            color: #fff;
        }

        .badge {
            background: #ff0044;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: bold;
        }

        .chat-container {
            display: flex;
            height: 550px;
        }

        /* LEWY PANEL - ROZMOWY / ZNAJOMI */
        .chat-sidebar {
            width: 320px;
            background: #0f0006;
            border-right: 1px solid #38001a;
            display: flex;
            flex-direction: column;
        }

        .search-box {
            padding: 15px;
            display: flex;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            background: #1f000c;
            border: 1px solid #56001a;
            border-radius: 8px;
            color: white;
            outline: none;
            font-family: Arial, sans-serif;
        }

        .add-friend-btn {
            background: #ad0137;
            border: none;
            color: white;
            padding: 0 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: 0.2s;
        }

        .add-friend-btn:hover {
            background: #e6004c;
        }

        .conversations-list {
            overflow-y: auto;
            flex: 1;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }

        .chat-item:hover, .chat-item.active {
            background: #2b000d;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            background: #38001a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            background-color: #00ff66;
            border-radius: 50%;
            border: 2px solid #0f0006;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            font-family: Arial, sans-serif;
        }

        .chat-time {
            font-size: 11px;
            color: #888;
            font-weight: normal;
        }

        .chat-preview {
            font-size: 13px;
            color: #aaa;
            margin-top: 3px;
            display: flex;
            justify-content: space-between;
            font-family: Arial, sans-serif;
        }

        /* PRAWY PANEL - WIADOMOŚCI */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(5, 0, 2, 0.9);
        }

        .chat-header {
            padding: 15px;
            background: #140007;
            border-bottom: 1px solid #38001a;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: Arial, sans-serif;
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('logo.jpg') center/cover no-repeat;
            font-family: Arial, sans-serif;
        }

        .empty-chat-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #777;
            font-size: 18px;
            text-align: center;
        }

        .date-divider {
            text-align: center;
            margin: 10px 0;
            font-size: 12px;
            color: #888;
            background: rgba(0,0,0,0.5);
            padding: 4px 12px;
            border-radius: 10px;
            align-self: center;
        }

        .message {
            max-width: 65%;
            display: flex;
            gap: 10px;
        }

        .message.received {
            align-self: flex-start;
        }

        .message.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message.received .msg-bubble {
            background: #242424;
            color: #fff;
            border-bottom-left-radius: 2px;
        }

        .message.sent .msg-bubble {
            background: #ad0137;
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg-time {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
            float: right;
            margin-left: 8px;
        }

        /* FORMULARZ PISANIA */
        .chat-input-area {
            padding: 15px;
            background: #140007;
            border-top: 1px solid #38001a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 15px;
            background: #1f000c;
            border: 1px solid #56001a;
            border-radius: 20px;
            color: white;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .send-btn {
            background: #ad0137;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #e6004c;
        }

        .chat-footer {
            background: #0f0006;
            text-align: center;
            padding: 8px;
            font-size: 12px;
            border-top: 1px solid #38001a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
            font-family: Arial, sans-serif;
        }

        .logout-link {
            color: #ff4466;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- OKNO LOGOWANIA / REJESTRACJI -->
    <div class="modal-overlay" id="authModal">
        <div class="auth-box">
            <h2 id="authTitle">Logowanie</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <input type="text" id="usernameInput" placeholder="Nazwa użytkownika" required autocomplete="off">
                <input type="password" id="passwordInput" placeholder="Hasło" required>
                <button type="submit" id="authSubmitBtn">Zaloguj się</button>
            </form>
            <div class="auth-switch" id="authSwitchText" onclick="toggleAuthMode()">
                Nie masz konta? <span>Zarejestruj się</span>
            </div>
        </div>
    </div>

    <header>
        <img src="logo3.jpg" style="float: right;" height="100px" alt="Logo"> 
        Bag.Net 330
        <div class="skibidi">
            Społeczność internetowa
        </div>
    </header>

    <main>
        <div class="bt-align">
            <a href="https://t.me/bagnetka66" class="button">TELEGRAM</a>
            <a href="https://discord.gg/VFgfawyxhQ" class="button">DISCORD</a>
            <a href="https://www.youtube.com/@kazikKazik-x6z" class="button">YOUTUBE</a>
            <button class="button">TIKTOK</button>
            <button class="button active">CZAT</button>
            <button class="button" onclick="askPasscode()">ADMINISTRACJA</button>
        </div>

        <!-- GŁÓWNE OKNO KOMUNIKATORA (widoczne po zalogowaniu) -->
        <div class="chat-wrapper" id="chatWrapper">
            <div class="chat-navbar">
                <div class="chat-brand">
                    <img src="logo3.jpg" alt="Bag.Net Logo">
                    <span id="currentLoggedUser">Bag.Net</span>
                </div>
                <div class="chat-nav-tabs">
                    <button class="nav-tab active">💬 Czaty</button>
                    <button class="nav-tab" onclick="openAddFriendPrompt()">👥 Dodaj znajomeго</button>
                </div>
            </div>

            <div class="chat-container">
                <!-- LEWY PANEL - POCZĄTKOWO PUSTY -->
                <div class="chat-sidebar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Szukaj rozmów..." onkeyup="filterChats()">
                        <button class="add-friend-btn" onclick="openAddFriendPrompt()" title="Dodaj znajomego">+</button>
                    </div>
                    <div class="conversations-list" id="conversationsList">
                        <!-- Tutaj będą pojawiać się dodane osoby -->
                    </div>
                </div>

                <!-- PRAWY PANEL - ROZMOWA -->
                <div class="chat-main">
                    <div class="chat-header" id="chatHeader">
                        <div style="color: #777; font-style: italic;">Wybierz czat lub dodaj znajomego, aby zacząć pisać.</div>
                    </div>

                    <div class="messages-area" id="messagesArea">
                        <div class="empty-chat-placeholder">Brak aktywnej konwersacji.</div>
                    </div>

                    <form class="chat-input-area" id="messageForm" onsubmit="sendMessage(event)" style="display: none;">
                        <button type="button" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:18px;">😊</button>
                        <input type="text" id="messageInput" placeholder="Napisz wiadomość..." autocomplete="off">
                        <button type="submit" class="send-btn">➤</button>
                    </form>
                </div>
            </div>

            <div class="chat-footer">
                <div>Zalogowano jako: <strong id="footerUsername"></strong></div>
                <div class="logout-link" onclick="logout()">Wyloguj się</div>
            </div>
        </div>
    </main>

    <script>
        let isRegisterMode = false;
        let currentUser = null;
        let chatsData = {}; // Przechowuje czaty aktywnego użytkownika
        let activeChatId = null;

        // Przełączanie formularza Logowania / Rejestracji
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("authTitle").textContent = isRegisterMode ? "Rejestracja" : "Logowanie";
            document.getElementById("authSubmitBtn").textContent = isRegisterMode ? "Utwórz konto" : "Zaloguj się";
            document.getElementById("authSwitchText").innerHTML = isRegisterMode 
                ? "Masz już konto? <span>Zaloguj się</span>" 
                : "Nie masz konta? <span>Zarejestruj się</span>";
        }

        // Obsługa formularza logowania i rejestracji
        function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById("usernameInput").value.trim();
            const password = document.getElementById("passwordInput").value.trim();

            if (!username || !password) return;

            // Pobieranie zapisanych użytkowników z localStorage
            let users = JSON.parse(localStorage.getItem("bagnet_users")) || {};

            if (isRegisterMode) {
                if (users[username]) {
                    alert("Taki użytkownik już istnieje! Wybierz inną nazwę.");
                    return;
                }
                // Tworzenie nowego konta
                users[username] = {
                    password: password,
                    chats: {} // Pusta początkowa lista znajomych/czatów dla nowego usera
                };
                localStorage.setItem("bagnet_users", JSON.stringify(users));
                alert("Konto zostało utworzone! Zaloguj się teraz.");
                toggleAuthMode();
                document.getElementById("authForm").reset();
            } else {
                // Logowanie
                if (!users[username] || users[username].password !== password) {
                    alert("Nieprawidłowa nazwa użytkownika lub hasło!");
                    return;
                }
                
                // Udane logowanie
                currentUser = username;
                chatsData = users[username].chats;
                
                // Zapisz sesję
                localStorage.setItem("bagnet_current_user", currentUser);

                // Schowaj okno logowania, pokaż czat
                document.getElementById("authModal").style.display = "none";
                document.getElementById("chatWrapper").style.display = "block";
                document.getElementById("footerUsername").textContent = currentUser;
                document.getElementById("currentLoggedUser").textContent = "Bag.Net – " + currentUser;

                renderSidebar();
            }
        }

        // Sprawdzenie sesji przy odświeżeniu strony
        window.onload = function() {
            const savedUser = localStorage.getItem("bagnet_current_user");
            if (savedUser) {
                let users = JSON.parse(localStorage.getItem("bagnet_users")) || {};
                if (users[savedUser]) {
                    currentUser = savedUser;
                    chatsData = users[savedUser].chats;

                    document.getElementById("authModal").style.display = "none";
                    document.getElementById("chatWrapper").style.display = "block";
                    document.getElementById("footerUsername").textContent = currentUser;
                    document.getElementById("currentLoggedUser").textContent = "Bag.Net – " + currentUser;

                    renderSidebar();
                }
            }
        };

        function logout() {
            localStorage.removeItem("bagnet_current_user");
            location.reload();
        }

        // Zapisywanie stanu czatów użytkownika
        function saveUserData() {
            let users = JSON.parse(localStorage.getItem("bagnet_users")) || {};
            if (users[currentUser]) {
                users[currentUser].chats = chatsData;
                localStorage.setItem("bagnet_users", JSON.stringify(users));
            }
        }

        // Dodawanie znajomego (pojawia się fizycznie po lewej stronie)
        function openAddFriendPrompt() {
            const friendName = prompt("Podaj nazwę użytkownika, którego chcesz dodać do znajomych:");
            if (!friendName) return;

            const trimmedName = friendName.trim();
            if (trimmedName === currentUser) {
                alert("Nie możesz dodać samego siebie do znajomych!");
                return;
            }

            if (chatsData[trimmedName]) {
                alert("Ta osoba jest już na Twojej liście znajomych.");
                selectChat(trimmedName);
                return;
            }

            // Tworzenie nowej konwersacji na liście
            chatsData[trimmedName] = {
                id: trimmedName,
                name: trimmedName,
                avatarText: trimmedName.charAt(0).toUpperCase(),
                avatarBg: getRandomColor(),
                online: true,
                badge: 0,
                messages: [
                    { sender: "received", text: `Cześć! Od teraz możemy pisać na Bag.Net. 👋`, time: getCurrentTime() }
                ]
            };

            saveUserData();
            renderSidebar();
            selectChat(trimmedName);
        }

        function getRandomColor() {
            const colors = ["#1e3a8a", "#3b0764", "#854d0e", "#15803d", "#991b1b", "#5b21b6"];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function getCurrentTime() {
            const now = new Date();
            return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        }

        // Renderowanie lewej listy kontaktów
        function renderSidebar() {
            const container = document.getElementById("conversationsList");
            container.innerHTML = "";

            const chatKeys = Object.keys(chatsData);

            if (chatKeys.length === 0) {
                container.innerHTML = `<div style="padding: 20px; text-align: center; color: #7f7f7f; font-size: 13px;">Brak znajomych. Kliknij <b>+</b> u góry, aby dodać kogoś do rozmowy.</div>`;
                return;
            }

            chatKeys.forEach(key => {
                const chat = chatsData[key];
                const lastMsg = chat.messages[chat.messages.length - 1];
                const lastMsgText = lastMsg ? lastMsg.text : "";
                const lastMsgTime = lastMsg ? lastMsg.time : "";

                const item = document.createElement("div");
                item.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                item.onclick = () => selectChat(chat.id);

                item.innerHTML = `
                    <div class="avatar-container">
                        <div class="avatar" style="background-color: ${chat.avatarBg};">${chat.avatarText}</div>
                        ${chat.online ? '<div class="status-dot"></div>' : ''}
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">
                            <span>${chat.name}</span>
                            <span class="chat-time">${lastMsgTime}</span>
                        </div>
                        <div class="chat-preview">
                            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px;">${lastMsgText}</span>
                            ${chat.badge > 0 ? `<span class="badge">${chat.badge}</span>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Wybór czatu
        function selectChat(chatId) {
            activeChatId = chatId;
            chatsData[chatId].badge = 0;
            saveUserData();
            renderSidebar();
            renderChatMain();
            document.getElementById("messageForm").style.display = "flex";
        }

        // Renderowanie okna konwersacji
        function renderChatMain() {
            if (!activeChatId || !chatsData[activeChatId]) return;

            const chat = chatsData[activeChatId];
            const header = document.getElementById("chatHeader");
            const messagesArea = document.getElementById("messagesArea");

            let avatarHtml = `<div class="avatar" style="width:35px; height:35px; background-color: ${chat.avatarBg};">${chat.avatarText}</div>`;

            header.innerHTML = `
                ${avatarHtml}
                <div>
                    <div style="font-weight: bold;">${chat.name} <span style="color: #00ff66; font-size: 10px;">● Online</span></div>
                </div>
            `;

            messagesArea.innerHTML = `<div class="date-divider">Dzisiaj</div>`;
            
            chat.messages.forEach(msg => {
                const msgDiv = document.createElement("div");
                msgDiv.className = `message ${msg.sender}`;

                if (msg.sender === "received") {
                    msgDiv.innerHTML = `
                        ${avatarHtml}
                        <div class="msg-bubble">
                            ${msg.text}
                            <span class="msg-time">${msg.time}</span>
                        </div>
                    `;
                } else {
                    msgDiv.innerHTML = `
                        <div class="msg-bubble">
                            ${msg.text}
                            <span class="msg-time">${msg.time} ✓✓</span>
                        </div>
                    `;
                }
                messagesArea.appendChild(msgDiv);
            });

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Wysyłanie wiadomości
        function sendMessage(e) {
            e.preventDefault();
            if (!activeChatId) return;

            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text) return;

            const time = getCurrentTime();
            const chat = chatsData[activeChatId];

            chat.messages.push({
                sender: "sent",
                text: text,
                time: time
            });

            input.value = "";
            saveUserData();
            renderChatMain();
            renderSidebar();

            // Automatyczna symulacja odpowiedzi od znajomego po 1.5 sekundy
            setTimeout(() => {
                chat.messages.push({
                    sender: "received",
                    text: `Otrzymałem Twoją wiadomość: "${text}" 👍`,
                    time: getCurrentTime()
                });
                saveUserData();
                renderChatMain();
                renderSidebar();
            }, 1500);
        }

        // Filtrowanie listy znajomych
        function filterChats() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const items = document.querySelectorAll(".chat-item");

            items.forEach(item => {
                const name = item.querySelector(".chat-name span").textContent.toLowerCase();
                item.style.display = name.includes(query) ? "flex" : "none";
            });
        }

        function askPasscode() {
            const passcode = prompt("Podaj kod dostępu:");
            if (passcode === "666") {
                window.location.href = "stronka2.html";
            } else if (passcode !== null) {
                alert("Nieprawidłowy kod dostępu!");
            }
        }
    </script>
</body>
