<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BagNet - Czat na żywo</title>
    <link href="https://fonts.cdnfonts.com/css/black-family" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/final-front" rel="stylesheet">
    
    <!-- Skrypty Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDoc, updateDoc, onSnapshot, arrayUnion, query, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // TUTAJ WKLEJ SWOJĄ KONFIGURACJĘ Z FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "TWÓJ_API_KEY",
            authDomain: "TWÓJ_PROJECT_ID.firebaseapp.com",
            projectId: "TWÓJ_PROJECT_ID",
            storageBucket: "TWÓJ_PROJECT_ID.appspot.com",
            messagingSenderId: "TWÓJ_SENDER_ID",
            appId: "TWÓJ_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentUser = null;
        let activeChatId = null;
        let unsubscribeMessages = null;
        let unsubscribeUserCheck = null;

        window.toggleAuthMode = function() {
            const isReg = document.getElementById("authTitle").textContent === "Logowanie";
            document.getElementById("authTitle").textContent = isReg ? "Rejestracja" : "Logowanie";
            document.getElementById("authSubmitBtn").textContent = isReg ? "Utwórz konto" : "Zaloguj się";
            document.getElementById("authSwitchText").innerHTML = isReg 
                ? "Masz już konto? <span>Zaloguj się</span>" 
                : "Nie masz konta? <span>Zarejestruj się</span>";
        };

        window.handleAuth = async function(e) {
            e.preventDefault();
            const username = document.getElementById("usernameInput").value.trim().toLowerCase();
            const password = document.getElementById("passwordInput").value.trim();
            const isReg = document.getElementById("authTitle").textContent === "Rejestracja";

            if (!username || !password) return;

            const userRef = doc(db, "users", username);
            const userSnap = await getDoc(userRef);

            if (isReg) {
                if (userSnap.exists()) {
                    alert("Taki użytkownik już istnieje!");
                    return;
                }
                await setDoc(userRef, { password: password, friends: [] });
                alert("Konto utworzone! Możesz się zalogować.");
                window.toggleAuthMode();
            } else {
                if (!userSnap.exists() || userSnap.data().password !== password) {
                    alert("Nieprawidłowy login lub hasło!");
                    return;
                }
                currentUser = username;
                localStorage.setItem("bagnet_user", currentUser);
                initChatApp();
            }
        };

        window.logout = function() {
            localStorage.removeItem("bagnet_user");
            location.reload();
        };

        window.onload = function() {
            const saved = localStorage.getItem("bagnet_user");
            if (saved) {
                currentUser = saved;
                initChatApp();
            }
        };

        function initChatApp() {
            document.getElementById("authModal").style.display = "none";
            document.getElementById("chatWrapper").style.display = "block";
            document.getElementById("footerUsername").textContent = currentUser;
            document.getElementById("currentLoggedUser").textContent = "Bag.Net – " + currentUser;
            loadFriendsList();
        }

        // Nasłuchiwanie listy znajomych/czatów z bazy
        function loadFriendsList() {
            const userRef = doc(db, "users", currentUser);
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    renderSidebar(data.friends || []);
                }
            });
        }

        function renderSidebar(friends) {
            const container = document.getElementById("conversationsList");
            container.innerHTML = "";

            if (friends.length === 0) {
                container.innerHTML = `<div style="padding: 20px; text-align: center; color: #7f7f7f; font-size: 13px;">Brak znajomych. Kliknij <b>+</b> aby kogoś dodać.</div>`;
                return;
            }

            friends.forEach(friendName => {
                const item = document.createElement("div");
                item.className = `chat-item ${friendName === activeChatId ? 'active' : ''}`;
                item.onclick = () => selectChat(friendName);

                item.innerHTML = `
                    <div class="avatar-container">
                        <div class="avatar" style="background-color: #5b21b6;">${friendName.charAt(0).toUpperCase()}</div>
                        <div class="status-dot"></div>
                    </div>
                    <div class="chat-info">
                        <div class="chat-name">
                            <span>${friendName}</span>
                        </div>
                        <div class="chat-preview">Kliknij, aby pisać</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        window.openAddFriendPrompt = async function() {
            const friendName = prompt("Podaj dokładną nazwę użytkownika, którego chcesz dodać:");
            if (!friendName) return;
            const target = friendName.trim().toLowerCase();

            if (target === currentUser) {
                alert("Nie możesz dodać samego siebie!");
                return;
            }

            const targetRef = doc(db, "users", target);
            const targetSnap = await getDoc(targetRef);

            if (!targetSnap.exists()) {
                alert("Taki użytkownik nie istnieje w bazie!");
                return;
            }

            // Dodaj do znajomych u siebie
            const myRef = doc(db, "users", currentUser);
            await updateDoc(myRef, {
                friends: arrayUnion(target)
            });

            // Opcjonalnie dodaj też siebie do jego listy, żeby widział dwustronnie
            await updateDoc(targetRef, {
                friends: arrayUnion(currentUser)
            });

            alert("Dodano znajomego pomyślnie!");
        };

        window.selectChat = function(friendName) {
            activeChatId = friendName;
            loadFriendsList();
            renderChatMain(friendName);
            document.getElementById("messageForm").style.display = "flex";
        }

        function getChatRoomId(user1, user2) {
            return [user1, user2].sort().join("_");
        }

        function renderChatMain(friendName) {
            const header = document.getElementById("chatHeader");
            header.innerHTML = `
                <div class="avatar" style="width:35px; height:35px; background-color: #5b21b6;">${friendName.charAt(0).toUpperCase()}</div>
                <div><div style="font-weight: bold;">${friendName} <span style="color: #00ff66; font-size: 10px;">● Online</span></div></div>
            `;

            const roomId = getChatRoomId(currentUser, friendName);
            const messagesRef = collection(db, "chats", roomId, "messages");

            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(messagesRef);
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const messagesArea = document.getElementById("messagesArea");
                messagesArea.innerHTML = `<div class="date-divider">Historia konwersacji na żywo</div>`;
                
                let docsList = [];
                snapshot.forEach(doc => docsList.push(doc.data()));
                docsList.sort((a, b) => a.timestamp - b.timestamp);

                docsList.forEach(msg => {
                    const isSent = msg.sender === currentUser;
                    const msgDiv = document.createElement("div");
                    msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
                    msgDiv.innerHTML = `
                        <div class="msg-bubble">
                            ${msg.text}
                            <span class="msg-time">${msg.time}</span>
                        </div>
                    `;
                    messagesArea.appendChild(msgDiv);
                });
                messagesArea.scrollTop = messagesArea.scrollHeight;
            });
        }

        window.sendMessage = async function(e) {
            e.preventDefault();
            if (!activeChatId) return;

            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if (!text) return;

            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const roomId = getChatRoomId(currentUser, activeChatId);

            await addDoc(collection(db, "chats", roomId, "messages"), {
                sender: currentUser,
                text: text,
                time: timeStr,
                timestamp: Date.now()
            });

            input.value = "";
        };

        window.filterChats = function() {
            const queryVal = document.getElementById("searchInput").value.toLowerCase();
            document.querySelectorAll(".chat-item").forEach(item => {
                const name = item.querySelector(".chat-name span").textContent.toLowerCase();
                item.style.display = name.includes(queryVal) ? "flex" : "none";
            });
        };

        window.askPasscode = function() {
            const passcode = prompt("Podaj kod dostępu:");
            if (passcode === "666") {
                window.location.href = "stronka2.html";
            } else if (passcode !== null) {
                alert("Nieprawidłowy kod dostępu!");
            }
        };
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #000000; color: #ffffff; font-family: 'Times New Roman', Times, serif; }
        header { background-color: rgb(79, 0, 29); color: white; font-size: 80px; font-family: 'Final Front', sans-serif; margin: 20px; border: 5px solid rgb(56, 0, 26); padding: 10px; }
        .skibidi { font-family: 'Times New Roman', Times, serif; font-size: 25px; }
        .bt-align { margin: 0 20px 20px 20px; display: flex; flex-wrap: wrap; gap: 15px; }
        .button { background-color: #ad0137; color: rgb(18, 0, 25); border: 5px solid #ad012c; border-radius: 5px; padding: 10px 15px; text-align: center; text-decoration: none; font-family: Georgia, serif; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.3s ease; }
        .button:hover, .button.active { transform: scale(1.08); background-color: #e6004c; color: #ffffff; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: #140007; border: 3px solid #ad0137; border-radius: 12px; padding: 30px; width: 350px; text-align: center; box-shadow: 0 0 25px rgba(173, 1, 55, 0.6); }
        .auth-box h2 { font-family: 'Final Front', sans-serif; font-size: 30px; margin-bottom: 20px; }
        .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #1f000c; border: 1px solid #56001a; border-radius: 8px; color: white; outline: none; }
        .auth-box button { width: 100%; padding: 12px; background: #ad0137; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .auth-switch { margin-top: 15px; font-size: 14px; color: #aaa; cursor: pointer; }
        .auth-switch span { color: #ff3366; text-decoration: underline; }

        .chat-wrapper { margin: 0 20px 40px 20px; background: rgba(10, 0, 5, 0.95); border: 2px solid #ad0137; border-radius: 12px; display: none; overflow: hidden; }
        .chat-navbar { background-color: #1a0008; display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #38001a; }
        .chat-brand { display: flex; align-items: center; gap: 10px; font-family: 'Final Front', sans-serif; font-size: 22px; }
        .chat-brand img { width: 35px; height: 35px; border-radius: 50%; }
        .chat-nav-tabs { display: flex; gap: 10px; }
        .nav-tab { background: #2b000d; color: #ccc; border: 1px solid #56001a; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; }
        .nav-tab:hover { background: #ad0137; color: #fff; }

        .chat-container { display: flex; height: 550px; }
        .chat-sidebar { width: 320px; background: #0f0006; border-right: 1px solid #38001a; display: flex; flex-direction: column; }
        .search-box { padding: 15px; display: flex; gap: 8px; }
        .search-box input { flex: 1; padding: 10px; background: #1f000c; border: 1px solid #56001a; border-radius: 8px; color: white; outline: none; }
        .add-friend-btn { background: #ad0137; border: none; color: white; padding: 0 12px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        
        .conversations-list { overflow-y: auto; flex: 1; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .chat-item:hover, .chat-item.active { background: #2b000d; }
        .avatar-container { position: relative; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; background-color: #00ff66; border-radius: 50%; border: 2px solid #0f0006; }
        .chat-info { flex: 1; }
        .chat-name { font-size: 15px; font-weight: bold; }
        .chat-preview { font-size: 13px; color: #aaa; margin-top: 3px; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background: rgba(5, 0, 2, 0.9); }
        .chat-header { padding: 15px; background: #140007; border-bottom: 1px solid #38001a; display: flex; align-items: center; gap: 12px; }
        .messages-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('logo.jpg') center/cover; }
        .date-divider { text-align: center; margin: 10px 0; font-size: 12px; color: #888; background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 10px; align-self: center; }
        
        .message { max-width: 65%; display: flex; gap: 10px; }
        .message.received { align-self: flex-start; }
        .message.sent { align-self: flex-end; }
        .msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; word-wrap: break-word; background: #242424; }
        .message.sent .msg-bubble { background: #ad0137; color: #fff; }
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.6); margin-top: 4px; float: right; margin-left: 8px; }

        .chat-input-area { padding: 15px; background: #140007; border-top: 1px solid #38001a; display: flex; align-items: center; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px 15px; background: #1f000c; border: 1px solid #56001a; border-radius: 20px; color: white; outline: none; }
        .send-btn { background: #ad0137; border: none; color: white; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        
        .chat-footer { background: #0f0006; text-align: center; padding: 10px 20px; font-size: 12px; border-top: 1px solid #38001a; display: flex; justify-content: space-between; }
        .logout-link { color: #ff4466; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- OKNO LOGOWANIA / REJESTRACJI -->
    <div class="modal-overlay" id="authModal">
        <div class="auth-box">
            <h2 id="authTitle">Logowanie</h2>
            <form id="authForm" onsubmit="handleAuth(event)">
                <input type="text" id="usernameInput" placeholder="Nazwa użytkownika" required autocomplete="off">
                <input type="password" id="passwordInput" placeholder="Hasło" required>
                <button type="submit" id="authSubmitBtn">Zaloguj się</button>
            </form>
            <div class="auth-switch" id="authSwitchText" onclick="toggleAuthMode()">
                Nie masz konta? <span>Zarejestruj się</span>
            </div>
        </div>
    </div>

    <header>
        <img src="logo3.jpg" style="float: right;" height="100px" alt="Logo"> 
        Bag.Net 330
        <div class="skibidi">Społeczność internetowa</div>
    </header>

    <main>
        <div class="bt-align">
            <a href="https://t.me/bagnetka66" class="button">TELEGRAM</a>
            <a href="https://discord.gg/VFgfawyxhQ" class="button">DISCORD</a>
            <a href="https://www.youtube.com/@kazikKazik-x6z" class="button">YOUTUBE</a>
            <button class="button">TIKTOK</button>
            <button class="button active">CZAT</button>
            <button class="button" onclick="askPasscode()">ADMINISTRACJA</button>
        </div>

        <!-- GŁÓWNE OKNO CZATU -->
        <div class="chat-wrapper" id="chatWrapper">
            <div class="chat-navbar">
                <div class="chat-brand">
                    <img src="logo3.jpg" alt="Bag.Net Logo">
                    <span id="currentLoggedUser">Bag.Net</span>
                </div>
                <div class="chat-nav-tabs">
                    <button class="nav-tab active">💬 Czaty</button>
                    <button class="nav-tab" onclick="openAddFriendPrompt()">👥 Dodaj znajomego</button>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-sidebar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Szukaj znajomych..." onkeyup="filterChats()">
                        <button class="add-friend-btn" onclick="openAddFriendPrompt()" title="Dodaj">+</button>
                    </div>
                    <div class="conversations-list" id="conversationsList"></div>
                </div>

                <div class="chat-main">
                    <div class="chat-header" id="chatHeader">
                        <div style="color: #777; font-style: italic;">Wybierz konwersację z listy po lewej.</div>
                    </div>
                    <div class="messages-area" id="messagesArea">
                        <div style="margin: auto; color: #777;">Wybierz znajomego, aby zacząć pisać.</div>
                    </div>
                    <form class="chat-input-area" id="messageForm" onsubmit="sendMessage(event)" style="display: none;">
                        <input type="text" id="messageInput" placeholder="Napisz wiadomość do znajomego..." autocomplete="off">
                        <button type="submit" class="send-btn">➤</button>
                    </form>
                </div>
            </div>

            <div class="chat-footer">
                <div>Zalogowano jako: <strong id="footerUsername"></strong></div>
                <div class="logout-link" onclick="logout()">Wyloguj się</div>
            </div>
        </div>
    </main>
</body>
</html>
